<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow - Premium Pomodoro Timer & Task Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glass-modal {
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Smooth transitions for theme switching */
        body {
            transition: background-color 0.5s ease, color 0.5s ease;
        }
    </style>
</head>
<body id="bodyTag" class="h-full bg-red-800 text-white font-sans flex flex-col justify-between selection:bg-white selection:text-red-900">

    <!-- Header / Navbar -->
    <header class="w-full max-w-2xl mx-auto px-4 py-6 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-xl shadow-inner">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wide">FocusFlow</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button id="soundToggleBtn" onclick="toggleSound()" aria-label="Toggle Sound" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center transition focus:outline-none focus:ring-2 focus:ring-white">
                <i id="soundIcon" class="fa-solid fa-volume-high"></i>
            </button>
            <button onclick="openSettingsModal()" aria-label="Open Settings" class="flex items-center space-x-2 px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 transition text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-white">
                <i class="fa-solid fa-gear"></i>
                <span class="hidden sm:inline">Settings</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-xl mx-auto px-4 flex-1 flex flex-col items-center justify-center pb-12">
        
        <!-- Timer Card -->
        <div class="w-full glass-panel rounded-3xl p-6 sm:p-10 shadow-2xl flex flex-col items-center relative overflow-hidden">
            
            <!-- Session Mode Tabs -->
            <div class="flex bg-black/20 p-1.5 rounded-2xl mb-8 w-full max-w-xs justify-between text-xs sm:text-sm font-medium">
                <button onclick="switchMode('work')" id="tabWork" class="flex-1 py-2 rounded-xl transition duration-300 focus:outline-none">Work</button>
                <button onclick="switchMode('shortBreak')" id="tabShortBreak" class="flex-1 py-2 rounded-xl transition duration-300 focus:outline-none">Short Break</button>
                <button onclick="switchMode('longBreak')" id="tabLongBreak" class="flex-1 py-2 rounded-xl transition duration-300 focus:outline-none">Long Break</button>
            </div>

            <!-- Timer Display -->
            <div class="text-7xl sm:text-9xl font-extrabold tracking-tighter mb-8 font-mono drop-shadow-md select-none" id="timerDisplay">
                25:00
            </div>

            <!-- Progress Bar / Visualizer -->
            <div class="w-full bg-black/20 h-2 rounded-full mb-8 overflow-hidden">
                <div id="timerProgressBar" class="bg-white h-full transition-all duration-1000" style="width: 100%;"></div>
            </div>

            <!-- Control Buttons -->
            <div class="flex items-center space-x-4">
                <button id="startPauseBtn" onclick="toggleTimer()" class="px-10 py-4 rounded-2xl bg-white text-gray-900 font-bold text-lg shadow-lg hover:bg-gray-100 hover:scale-105 active:scale-95 transition transform focus:outline-none focus:ring-4 focus:ring-white/50">
                    Start
                </button>
                <button onclick="resetTimer()" title="Reset Timer" class="w-14 h-14 rounded-2xl bg-white/10 hover:bg-white/20 flex items-center justify-center text-lg transition focus:outline-none focus:ring-2 focus:ring-white">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                <button onclick="skipSession()" title="Skip Session" class="w-14 h-14 rounded-2xl bg-white/10 hover:bg-white/20 flex items-center justify-center text-lg transition focus:outline-none focus:ring-2 focus:ring-white">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>

        </div>

        <!-- Session & Task Status Info -->
        <div class="w-full mt-6 flex flex-col sm:flex-row items-center justify-between text-white/80 text-sm px-2 gap-2">
            <div id="sessionCounterText" class="font-medium">
                Session #1 &bull; 0/4 until Long Break
            </div>
            <div class="flex items-center space-x-1" id="pomodoroDots">
                <!-- Dots rendered via JS -->
            </div>
        </div>

        <!-- Task Manager Section -->
        <div class="w-full mt-8 glass-panel rounded-3xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg flex items-center space-x-2">
                    <i class="fa-solid fa-list-check"></i>
                    <span>Tasks</span>
                </h3>
                <span id="activeTaskLabel" class="text-xs bg-white/20 px-3 py-1 rounded-full font-medium truncate max-w-[200px]">No active task</span>
            </div>

            <!-- Add Task Form -->
            <form onsubmit="addTask(event)" class="flex gap-2 mb-4">
                <input type="text" id="taskInput" placeholder="What are you working on?" class="flex-1 bg-black/20 border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-white/50" required>
                <button type="submit" class="bg-white/20 hover:bg-white/30 px-5 py-2.5 rounded-xl font-semibold text-sm transition focus:outline-none focus:ring-2 focus:ring-white">
                    Add
                </button>
            </form>

            <!-- Task List -->
            <div id="taskList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                <!-- Rendered dynamically -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-white/60">
        FocusFlow &bull; Powered by Web Audio API & Tailwind CSS
    </footer>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden">
        <div class="glass-modal w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-2xl border border-white/20 text-white relative">
            
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold flex items-center space-x-2">
                    <i class="fa-solid fa-gear text-red-400"></i>
                    <span>Timer Settings</span>
                </h2>
                <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white/80 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form onsubmit="saveSettings(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-white/70 mb-2">Work Duration (minutes)</label>
                    <input type="number" id="settingWork" min="1" max="120" class="w-full bg-black/30 border border-white/20 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-red-400" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-white/70 mb-2">Short Break Duration (minutes)</label>
                    <input type="number" id="settingShortBreak" min="1" max="60" class="w-full bg-black/30 border border-white/20 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-teal-400" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-white/70 mb-2">Long Break Duration (minutes)</label>
                    <input type="number" id="settingLongBreak" min="1" max="60" class="w-full bg-black/30 border border-white/20 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                </div>

                <div class="space-y-3 pt-2">
                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-sm font-medium text-white/90">Auto-start Breaks</span>
                        <input type="checkbox" id="settingAutoBreaks" class="w-5 h-5 accent-red-500 rounded cursor-pointer">
                    </label>
                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-sm font-medium text-white/90">Auto-start Pomodoros</span>
                        <input type="checkbox" id="settingAutoPomodoros" class="w-5 h-5 accent-red-500 rounded cursor-pointer">
                    </label>
                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-sm font-medium text-white/90">Sound Notifications</span>
                        <input type="checkbox" id="settingSound" class="w-5 h-5 accent-red-500 rounded cursor-pointer">
                    </label>
                </div>

                <div class="pt-4 flex justify-end space-x-3">
                    <button type="button" onclick="closeSettingsModal()" class="px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 font-semibold text-sm transition">Cancel</button>
                    <button type="submit" class="px-6 py-2.5 rounded-xl bg-white text-gray-900 font-bold text-sm shadow hover:bg-gray-100 transition">Save Changes</button>
                </div>
            </form>

        </div>
    </div>

    <!-- Notification Alert Box (Custom Toast) -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-32 opacity-0 transition-all duration-300 glass-panel px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 border border-white/30">
        <i id="toastIcon" class="fa-solid fa-bell text-yellow-300 text-lg"></i>
        <span id="toastMessage" class="text-sm font-semibold">Notification message</span>
    </div>

    <!-- Application JavaScript -->
    <script>
        // State Management
        let state = {
            mode: 'work', // 'work' | 'shortBreak' | 'longBreak'
            timeLeft: 25 * 60,
            isRunning: false,
            endTime: null,
            timerInterval: null,
            workSessionsCompleted: 0,
            settings: {
                workDuration: 25,
                shortBreakDuration: 5,
                longBreakDuration: 15,
                autoBreaks: false,
                autoPomodoros: false,
                soundEnabled: true
            },
            tasks: [],
            activeTaskId: null
        };

        // Load State from localStorage
        function loadState() {
            const saved = localStorage.getItem('focusflow_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.settings = parsed.settings || state.settings;
                    state.tasks = parsed.tasks || [];
                    state.activeTaskId = parsed.activeTaskId || null;
                    state.workSessionsCompleted = parsed.workSessionsCompleted || 0;
                } catch(e) {
                    console.error("Failed to load saved state", e);
                }
            }
            // Set initial time based on mode
            setModeDuration(state.mode);
        }

        // Save State to localStorage
        function saveState() {
            localStorage.setItem('focusflow_state', JSON.stringify({
                settings: state.settings,
                tasks: state.tasks,
                activeTaskId: state.activeTaskId,
                workSessionsCompleted: state.workSessionsCompleted
            }));
        }

        // Web Audio API Synthesizer for Chime
        let audioCtx = null;
        function playChime() {
            if (!state.settings.soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                const now = audioCtx.currentTime;
                // Play a pleasant three-tone chord chime
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + index * 0.1);
                    
                    gain.gain.setValueAtTime(0, now + index * 0.1);
                    gain.gain.linearRampToValueAtTime(0.15, now + index * 0.1 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.1 + 1.2);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(now + index * 0.1);
                    osc.stop(now + index * 0.1 + 1.3);
                });
            } catch(e) {
                console.log("Audio not supported or blocked", e);
            }
        }

        // Timer Duration Helpers
        function getDurationForMode(mode) {
            switch(mode) {
                case 'work': return state.settings.workDuration * 60;
                case 'shortBreak': return state.settings.shortBreakDuration * 60;
                case 'longBreak': return state.settings.longBreakDuration * 60;
                default: return 25 * 60;
            }
        }

        function setModeDuration(mode) {
            state.mode = mode;
            state.timeLeft = getDurationForMode(mode);
            updateTheme();
            updateDisplay();
        }

        // Theme and Styling Updates based on Mode
        function updateTheme() {
            const body = document.getElementById('bodyTag');
            const tabWork = document.getElementById('tabWork');
            const tabShortBreak = document.getElementById('tabShortBreak');
            const tabLongBreak = document.getElementById('tabLongBreak');

            // Reset tab styles
            [tabWork, tabShortBreak, tabLongBreak].forEach(tab => {
                tab.className = "flex-1 py-2 rounded-xl transition duration-300 focus:outline-none text-white/70 hover:text-white";
            });

            if (state.mode === 'work') {
                body.className = "h-full bg-gradient-to-br from-red-900 via-rose-900 to-orange-900 text-white font-sans flex flex-col justify-between selection:bg-white selection:text-red-900";
                tabWork.className = "flex-1 py-2 rounded-xl transition duration-300 focus:outline-none bg-white/20 text-white font-bold shadow";
            } else if (state.mode === 'shortBreak') {
                body.className = "h-full bg-gradient-to-br from-teal-900 via-emerald-900 to-cyan-900 text-white font-sans flex flex-col justify-between selection:bg-white selection:text-teal-900";
                tabShortBreak.className = "flex-1 py-2 rounded-xl transition duration-300 focus:outline-none bg-white/20 text-white font-bold shadow";
            } else if (state.mode === 'longBreak') {
                body.className = "h-full bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 text-white font-sans flex flex-col justify-between selection:bg-white selection:text-blue-900";
                tabLongBreak.className = "flex-1 py-2 rounded-xl transition duration-300 focus:outline-none bg-white/20 text-white font-bold shadow";
            }
            updateSoundIcon();
        }

        // Update Timer Display & Progress Bar
        function updateDisplay() {
            const minutes = Math.floor(state.timeLeft / 60);
            const seconds = state.timeLeft % 60;
            const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            document.getElementById('timerDisplay').innerText = timeStr;
            document.title = `${timeStr} - FocusFlow (${state.mode === 'work' ? 'Work' : 'Break'})`;

            // Progress bar
            const totalDuration = getDurationForMode(state.mode);
            const progressPercent = (state.timeLeft / totalDuration) * 100;
            document.getElementById('timerProgressBar').style.width = `${progressPercent}%`;

            // Session Info & Dots
            const cycleCount = state.workSessionsCompleted % 4;
            document.getElementById('sessionCounterText').innerText = `Session #${state.workSessionsCompleted + 1} • ${cycleCount}/4 until Long Break`;
            
            const dotsContainer = document.getElementById('pomodoroDots');
            dotsContainer.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const dot = document.createElement('div');
                dot.className = `w-3 h-3 rounded-full transition-all duration-300 ${i < cycleCount ? 'bg-white shadow-md scale-110' : 'bg-white/30'}`;
                dotsContainer.appendChild(dot);
            }
        }

        // Timer Actions: Start, Pause, Resume, Reset, Skip
        function toggleTimer() {
            if (state.isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (state.isRunning) return;
            state.isRunning = true;
            state.endTime = Date.now() + state.timeLeft * 1000;
            
            const btn = document.getElementById('startPauseBtn');
            btn.innerText = "Pause";
            btn.className = "px-10 py-4 rounded-2xl bg-white/20 hover:bg-white/30 text-white font-bold text-lg shadow-lg hover:scale-105 active:scale-95 transition transform focus:outline-none focus:ring-4 focus:ring-white/50";

            state.timerInterval = setInterval(() => {
                const now = Date.now();
                const delta = Math.round((state.endTime - now) / 1000);
                
                if (delta <= 0) {
                    state.timeLeft = 0;
                    updateDisplay();
                    handleSessionComplete();
                } else {
                    state.timeLeft = delta;
                    updateDisplay();
                }
            }, 250);
        }

        function pauseTimer() {
            if (!state.isRunning) return;
            state.isRunning = false;
            clearInterval(state.timerInterval);

            const btn = document.getElementById('startPauseBtn');
            btn.innerText = "Resume";
            btn.className = "px-10 py-4 rounded-2xl bg-white text-gray-900 font-bold text-lg shadow-lg hover:bg-gray-100 hover:scale-105 active:scale-95 transition transform focus:outline-none focus:ring-4 focus:ring-white/50";
        }

        function resetTimer() {
            pauseTimer();
            state.timeLeft = getDurationForMode(state.mode);
            const btn = document.getElementById('startPauseBtn');
            btn.innerText = "Start";
            btn.className = "px-10 py-4 rounded-2xl bg-white text-gray-900 font-bold text-lg shadow-lg hover:bg-gray-100 hover:scale-105 active:scale-95 transition transform focus:outline-none focus:ring-4 focus:ring-white/50";
            updateDisplay();
        }

        function skipSession() {
            pauseTimer();
            if (state.mode === 'work') {
                if (state.workSessionsCompleted > 0 && (state.workSessionsCompleted + 1) % 4 === 0) {
                    switchMode('longBreak');
                } else {
                    switchMode('shortBreak');
                }
            } else {
                switchMode('work');
            }
        }

        function switchMode(mode) {
            pauseTimer();
            setModeDuration(mode);
            const btn = document.getElementById('startPauseBtn');
            btn.innerText = "Start";
            btn.className = "px-10 py-4 rounded-2xl bg-white text-gray-900 font-bold text-lg shadow-lg hover:bg-gray-100 hover:scale-105 active:scale-95 transition transform focus:outline-none focus:ring-4 focus:ring-white/50";
        }

        // Session Completion Handler
        function handleSessionComplete() {
            pauseTimer();
            playChime();

            const btn = document.getElementById('startPauseBtn');
            btn.innerText = "Start";
            btn.className = "px-10 py-4 rounded-2xl bg-white text-gray-900 font-bold text-lg shadow-lg hover:bg-gray-100 hover:scale-105 active:scale-95 transition transform focus:outline-none focus:ring-4 focus:ring-white/50";

            if (state.mode === 'work') {
                state.workSessionsCompleted++;
                // Increment active task pomodoro count if any
                if (state.activeTaskId) {
                    const task = state.tasks.find(t => t.id === state.activeTaskId);
                    if (task) {
                        task.completedPomodoros = (task.completedPomodoros || 0) + 1;
                    }
                }
                saveState();
                renderTasks();

                showToast("Work session completed! Time for a break.", "fa-circle-check", "text-green-300");

                // Determine next break
                if (state.workSessionsCompleted % 4 === 0) {
                    setModeDuration('longBreak');
                } else {
                    setModeDuration('shortBreak');
                }

                if (state.settings.autoBreaks) {
                    startTimer();
                }
            } else {
                showToast("Break finished! Let's get back to work.", "fa-fire", "text-orange-300");
                setModeDuration('work');

                if (state.settings.autoPomodoros) {
                    startTimer();
                }
            }
            updateDisplay();
        }

        // Task Manager Logic
        function addTask(event) {
            event.preventDefault();
            const input = document.getElementById('taskInput');
            const title = input.value.trim();
            if (!title) return;

            const newTask = {
                id: Date.now().toString(),
                title: title,
                completedPomodoros: 0,
                completed: false
            };

            state.tasks.push(newTask);
            if (!state.activeTaskId) {
                state.activeTaskId = newTask.id;
            }
            input.value = '';
            saveState();
            renderTasks();
            showToast("Task added successfully!", "fa-plus", "text-blue-300");
        }

        function toggleTaskComplete(id) {
            const task = state.tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveState();
                renderTasks();
            }
        }

        function setActiveTask(id) {
            state.activeTaskId = id;
            saveState();
            renderTasks();
        }

        function deleteTask(id) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            if (state.activeTaskId === id) {
                state.activeTaskId = state.tasks.length > 0 ? state.tasks[0].id : null;
            }
            saveState();
            renderTasks();
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            const activeTaskLabel = document.getElementById('activeTaskLabel');
            
            // Update active task label
            const activeTask = state.tasks.find(t => t.id === state.activeTaskId);
            if (activeTask) {
                activeTaskLabel.innerText = activeTask.title;
            } else {
                activeTaskLabel.innerText = "No active task";
            }

            if (state.tasks.length === 0) {
                taskList.innerHTML = `<p class="text-center text-xs text-white/50 py-4">No tasks yet. Add one above to get started!</p>`;
                return;
            }

            taskList.innerHTML = '';
            state.tasks.forEach(task => {
                const isActive = task.id === state.activeTaskId;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded-2xl transition ${isActive ? 'bg-white/20 border border-white/30' : 'bg-black/20 hover:bg-black/30'}`;
                
                div.innerHTML = `
                    <div class="flex items-center space-x-3 flex-1 min-w-0 cursor-pointer" onclick="setActiveTask('${task.id}')">
                        <button onclick="event.stopPropagation(); toggleTaskComplete('${task.id}')" class="w-5 h-5 rounded-full border border-white/50 flex items-center justify-center transition ${task.completed ? 'bg-white text-gray-900' : 'hover:border-white'}">
                            ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </button>
                        <span class="text-sm font-medium truncate ${task.completed ? 'line-through text-white/50' : 'text-white'}">${task.title}</span>
                    </div>
                    <div class="flex items-center space-x-3 ml-2">
                        <span class="text-xs bg-black/30 px-2.5 py-1 rounded-full font-mono font-semibold">${task.completedPomodoros || 0}🍅</span>
                        <button onclick="deleteTask('${task.id}')" class="text-white/50 hover:text-red-300 transition text-sm px-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                taskList.appendChild(div);
            });
        }

        // Settings Modal Management
        function openSettingsModal() {
            document.getElementById('settingWork').value = state.settings.workDuration;
            document.getElementById('settingShortBreak').value = state.settings.shortBreakDuration;
            document.getElementById('settingLongBreak').value = state.settings.longBreakDuration;
            document.getElementById('settingAutoBreaks').checked = state.settings.autoBreaks;
            document.getElementById('settingAutoPomodoros').checked = state.settings.autoPomodoros;
            document.getElementById('settingSound').checked = state.settings.soundEnabled;

            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings(event) {
            event.preventDefault();
            const work = parseInt(document.getElementById('settingWork').value);
            const shortB = parseInt(document.getElementById('settingShortBreak').value);
            const longB = parseInt(document.getElementById('settingLongBreak').value);

            if (isNaN(work) || isNaN(shortB) || isNaN(longB) || work <= 0 || shortB <= 0 || longB <= 0) {
                showToast("Please enter valid positive numbers.", "fa-triangle-exclamation", "text-red-400");
                return;
            }

            state.settings.workDuration = work;
            state.settings.shortBreakDuration = shortB;
            state.settings.longBreakDuration = longB;
            state.settings.autoBreaks = document.getElementById('settingAutoBreaks').checked;
            state.settings.autoPomodoros = document.getElementById('settingAutoPomodoros').checked;
            state.settings.soundEnabled = document.getElementById('settingSound').checked;

            saveState();
            closeSettingsModal();
            
            // Reset timer to apply new duration for current mode
            resetTimer();
            updateSoundIcon();
            showToast("Settings saved successfully!", "fa-circle-check", "text-green-300");
        }

        // Sound Toggle Button & Icon
        function toggleSound() {
            state.settings.soundEnabled = !state.settings.soundEnabled;
            saveState();
            updateSoundIcon();
            showToast(state.settings.soundEnabled ? "Sound enabled" : "Sound muted", "fa-volume-high", "text-white");
        }

        function updateSoundIcon() {
            const icon = document.getElementById('soundIcon');
            if (state.settings.soundEnabled) {
                icon.className = "fa-solid fa-volume-high";
            } else {
                icon.className = "fa-solid fa-volume-xmark opacity-50";
            }
        }

        // Toast Notification Helper
        function showToast(message, iconClass = "fa-bell", iconColor = "text-yellow-300") {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            const iconEl = document.getElementById('toastIcon');

            msgEl.innerText = message;
            iconEl.className = `fa-solid ${iconClass} ${iconColor} text-lg`;

            toast.classList.remove('translate-y-32', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
            }, 3500);
        }

        // Initialize on Load
        window.onload = function() {
            loadState();
            renderTasks();
            updateDisplay();
        };
    </script>
</body>
</html>
